# =============================================================
# Analyse SonarQube du Backend SouverainRecrut
# Lancée depuis backend/ : npm run sonar
# (URL et token fournis par l'environnement : SONAR_HOST_URL, SONAR_TOKEN)
# =============================================================
sonar.projectKey=souverainrecrut-backend
sonar.projectName=SouverainRecrut Backend
sonar.sourceEncoding=UTF-8

# Code applicatif et tests
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

# Annotations Swagger et déclarations de types : pas du code exécutable
sonar.exclusions=src/docs/**,src/swagger/**,src/**/*.md

# Couverture produite par Jest (npm run test:ci)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fichiers exclus de la couverture : alignés sur jest.config.js
sonar.coverage.exclusions=src/server.ts,src/config/prisma.ts,src/types/**

# TypeScript
sonar.typescript.tsconfigPaths=tsconfig.json

# Attendre le résultat du Quality Gate est géré par Jenkins (webhook)
sonar.qualitygate.wait=false
